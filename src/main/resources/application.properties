# Spring Application Name
spring.application.name=sumaqagro-backend

# Spring Profile
spring.profiles.active=dev

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sumaqagro?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true

# Spring JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.dymbia.sumaqagro.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy


# Spring Security Configuration
authorization.jwt.secret=${JWT_SECRET:}
authorization.jwt.expiration.minutes=${JWT_EXPIRATION_MINUTES:30}

# AgroMonitoring Configuration
agromonitoring.base-url=https://api.agromonitoring.com/agro/1.0
agromonitoring.api-key=${AGROMONITORING_API_KEY}
authorization.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}

#
iam.password-reset.email.enabled=${PASSWORD_RESET_EMAIL_ENABLED:false}
iam.password-reset.email.brevo.api-key=${BREVO_API_KEY:}
iam.password-reset.email.brevo.sender-email=${BREVO_SENDER_EMAIL:}
iam.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200/iam/reset-password}

# Public origin encoded in the quality certificate QR
sumaqagro.certification.public-base-url=http://localhost:8080
